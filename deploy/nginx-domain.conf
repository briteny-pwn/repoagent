server {
    listen 80;
    server_name repoagent.ai4s.chat;
    location ^~ /.well-known/acme-challenge/ { root /var/www/steward-acme; }
    location / { return 301 https://repoagent.ai4s.chat$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name repoagent.ai4s.chat;
    ssl_certificate /etc/letsencrypt/live/repository-steward-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/repository-steward-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/repository-steward/frontend/dist;
    index index.html;
    client_max_body_size 128k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://127.0.0.1:8017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
        access_log off;
    }
    location / { try_files $uri $uri/ /index.html; }
}
